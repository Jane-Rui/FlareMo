name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate build, resources and bundle without production writes"
        type: boolean
        default: true
      backup_confirmed:
        description: "For production enter BACKUP_CONFIRMED after securing a D1 backup"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @flaremo/web build

      - name: Check release authorization
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$BACKUP_CONFIRMED" != "BACKUP_CONFIRMED" ]; then
            echo "Production publication requires a verified D1 backup."
            exit 1
          fi

      - name: Check existing Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f6ff30bba40fbc7d791d83ab3e70daf9
        run: pnpm provision:remote --check

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f6ff30bba40fbc7d791d83ab3e70daf9
        run: pnpm exec wrangler deploy --config ./wrangler.jsonc --dry-run

      - name: Apply D1 migrations and deploy
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f6ff30bba40fbc7d791d83ab3e70daf9
        run: |
          pnpm migrate:remote
          pnpm exec wrangler deploy --config ./wrangler.jsonc

      - name: Smoke check public origin
        if: ${{ !inputs.dry_run }}
        run: pnpm smoke:check
        env:
          FLAREMO_PUBLIC_URL: https://flaremo.48kr.top
