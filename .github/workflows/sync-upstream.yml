name: Sync Upstream

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install, e.g. v0.3.1. Leave empty for latest."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'realchendahuang/FlareMo'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: realchendahuang/FlareMo
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync from upstream
        shell: bash
        run: |
          set -euo pipefail

          target_version="${{ inputs.version }}"
          if [[ -z "${target_version}" ]]; then
            target_version="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [[ ! "${target_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid FlareMo release tag: ${target_version}" >&2
            exit 1
          fi

          current_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid installed FlareMo version: ${current_version}" >&2
            exit 1
          fi

          target_number="${target_version#v}"
          IFS=. read -r current_major current_minor current_patch <<< "${current_version}"
          IFS=. read -r target_major target_minor target_patch <<< "${target_number}"

          if (( target_major < current_major ||
                (target_major == current_major && target_minor < current_minor) ||
                (target_major == current_major && target_minor == current_minor && target_patch < current_patch) )); then
            echo "Refusing to downgrade FlareMo from v${current_version} to ${target_version}." >&2
            exit 1
          fi
          if [[ "${target_number}" == "${current_version}" ]]; then
            echo "${target_version} is already installed. Nothing to do."
            exit 0
          fi

          git remote add flaremo-upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags flaremo-upstream \
            "refs/tags/${target_version}:refs/tags/${target_version}"

          git config user.name "flaremo-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Real three-way merge instead of a tag-to-tag patch.
          # git merge resolves the true common ancestor, so a deployment
          # repository that already contains upstream commits from between
          # two release tags still merges cleanly instead of double-applying
          # the overlapping changes (which made git apply --3way conflict).
          if ! git merge --no-edit -m "Sync FlareMo from v${current_version} to ${target_version}" "${target_version}"; then
            git merge --abort || true
            echo "The deployment repository conflicts with ${target_version}. Manual resolution required." >&2
            exit 1
          fi

          merged_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "${target_number}" != "${merged_version}" ]]; then
            echo "Merge result version ${merged_version} does not match ${target_version}. Manual resolution required." >&2
            exit 1
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Synced to ${target_version} and pushed to main."
